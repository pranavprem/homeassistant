name: homeassistant

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    volumes:
      - ${HA_CONFIG_PATH}:/config
      # Keep the full HA config as the persistent host bind. Repo-owned package
      # files are mounted below as Compose configs instead of raw relative bind
      # mounts, because Portainer Git stacks can otherwise hand Docker a host
      # path that is not the repo checkout and HA never sees the package file.
    configs:
      - source: kasa_bridge_package
        target: /config/packages/kasa_bridge.yaml
    ports:
      - ${HOMEASSISTANT_PORT:-8123}:8123
    networks:
      - proxy
      - automation
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8123 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Los_Angeles}
    volumes:
      - ${HA_CONFIG_PATH}/../grocy:/config
    ports:
      - ${GROCY_PORT:-9283}:80
    networks:
      - proxy
      - automation
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  homebutler:
    build:
      context: ./services/homebutler
    container_name: homebutler
    restart: unless-stopped
    depends_on:
      grocy:
        condition: service_healthy
    environment:
      - HOMEBUTLER_ENV=${HOMEBUTLER_ENV:-production}
      - HOMEBUTLER_HOST=0.0.0.0
      - HOMEBUTLER_PORT=8000
      - HOMEBUTLER_LOG_LEVEL=${HOMEBUTLER_LOG_LEVEL:-info}
      # Stack registry is the authoritative allowlist. This env var is now
      # *additive* — it can only extend the registry, never shrink it. Leave
      # unset in most setups.
      - HOMEBUTLER_CONTROLLED_CONTAINERS=${HOMEBUTLER_CONTROLLED_CONTAINERS:-}
      # Repo mounts (see volumes below). These point at paths INSIDE the
      # container; the host paths come from .env.
      - HOMEBUTLER_REPO_ROOT=/opt/repos
      - HOMEBUTLER_HOMEASSISTANT_REPO=/opt/repos/homeassistant
      - HOMEBUTLER_MEDIASERVER_REPO=/opt/repos/mediaserver
      - HOMEBUTLER_MORPHEUS_REPO=/opt/repos/morpheus
      - HOMEBUTLER_TOR_REPO=/opt/repos/tor
      # Global kill-switch for /ops/actions* routes.
      - HOMEBUTLER_ACTIONS_ENABLED=${HOMEBUTLER_ACTIONS_ENABLED:-true}
      - GROCY_BASE_URL=${GROCY_BASE_URL:-http://grocy}
      - GROCY_API_KEY=${GROCY_API_KEY:-}
      - GROCY_TIMEOUT_SECONDS=${GROCY_TIMEOUT_SECONDS:-10}
      - GROCY_VERIFY_SSL=${GROCY_VERIFY_SSL:-false}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Host repos bind-mounted into the container so allowlisted actions can
      # run `make <target>` / `docker compose <cmd>` against them. Mediaserver
      # and morpheus are RW because their Makefiles write state (.env, compose
      # artifacts); tor + homeassistant are RO (no actions need to write).
      - ${HOMEBUTLER_HOMEASSISTANT_REPO_HOST:-/volume1/docker/homeassistant}:/opt/repos/homeassistant:ro
      - ${HOMEBUTLER_MEDIASERVER_REPO_HOST:-/volume1/docker/mediaserver}:/opt/repos/mediaserver:rw
      - ${HOMEBUTLER_MORPHEUS_REPO_HOST:-/volume1/docker/morpheus}:/opt/repos/morpheus:rw
      - ${HOMEBUTLER_TOR_REPO_HOST:-/volume1/docker/tor}:/opt/repos/tor:ro
    ports:
      # NAS-local only, deliberately. HomeButler mounts docker.sock and has no
      # auth on /ops/*, so publishing this on the LAN is root-equivalent
      # exposure to every device on the WiFi. Neo reaches it through Home
      # Assistant on the internal `automation` network instead — see the
      # rest_command/script entities in packages/food_stack.yaml.template.
      - ${HOMEBUTLER_BIND_IP:-127.0.0.1}:${HOMEBUTLER_PORT:-8000}:8000
    networks:
      - automation
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ${HA_CONFIG_PATH}/../mosquitto/config:/mosquitto/config
      - ${HA_CONFIG_PATH}/../mosquitto/data:/mosquitto/data
      - ${HA_CONFIG_PATH}/../mosquitto/log:/mosquitto/log
    networks:
      - automation
    security_opt:
      - no-new-privileges:true
    # No `:-mqtt` fallback on the credentials. A default password that ships in
    # a public repo is not a password, and silently falling back to it means a
    # missing MQTT_PASSWORD in .env looks like a working broker instead of a
    # misconfigured one. Unset now yields an empty password, the healthcheck
    # fails, and the problem is visible in `docker compose ps`.
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-u", "${MQTT_USER:-mqtt}", "-P", "${MQTT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3

  govee2mqtt:
    image: ghcr.io/wez/govee2mqtt:latest
    container_name: govee2mqtt
    restart: unless-stopped
    environment:
      - GOVEE_EMAIL=${GOVEE_EMAIL}
      - GOVEE_PASSWORD=${GOVEE_PASSWORD}
      - GOVEE_API_KEY=${GOVEE_API_KEY}
      - GOVEE_MQTT_HOST=mosquitto
      - GOVEE_MQTT_PORT=1883
      - GOVEE_MQTT_USER=${MQTT_USER:-mqtt}
      # See the mosquitto healthcheck comment: no default password.
      - GOVEE_MQTT_PASSWORD=${MQTT_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - automation
    security_opt:
      - no-new-privileges:true
    # Upstream govee2mqtt ships as a distroless image, so shell-based probes
    # like `CMD-SHELL pidof ...` always fail. Disable the local Docker
    # healthcheck instead of reporting a false `unhealthy` state.
    healthcheck:
      disable: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ha-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      homeassistant:
        condition: service_healthy
      grocy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.31.240.0/24}
  automation:
    driver: bridge
    ipam:
      config:
        - subnet: ${AUTOMATION_SUBNET:-172.31.241.0/24}

configs:
  kasa_bridge_package:
    file: ./packages/kasa_bridge.yaml

# No named volumes — config path set via HA_CONFIG_PATH in .env
# Cloudflare tunnel route examples:
# - home.pranavprem.com → http://homeassistant:8123
# - grocy.pranavprem.com → http://grocy:80
