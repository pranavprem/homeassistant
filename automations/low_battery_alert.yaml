id: neo_low_battery_alert
alias: Low Battery Alert
description: Notify when any home device battery drops below 20%
triggers:
- trigger: time_pattern
  hours: "/6"
conditions: []
actions:
- variables:
    low_batteries: >
      {% set ns = namespace(devices=[]) %}
      {% set battery_sensors = [
        'sensor.backyard_curtain_battery',
        'sensor.deck_curtain_battery',
        'sensor.backyard_curtain_2_battery',
        'sensor.deck_curtain_2_battery',
        'sensor.studio_switch_battery',
        'sensor.guest_bedroom_switch_battery',
        'sensor.master_bedroom_switch_battery'
      ] %}
      {% for sensor in battery_sensors %}
        {% if states(sensor) not in ['unavailable', 'unknown'] and states(sensor) | int(100) < 20 %}
          {% set ns.devices = ns.devices + [state_attr(sensor, 'friendly_name') ~ ': ' ~ states(sensor) ~ '%'] %}
        {% endif %}
      {% endfor %}
      {{ ns.devices | join('\n') }}
- condition: template
  value_template: "{{ low_batteries | length > 0 }}"
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: "\U0001F50B Low Battery Alert"
    message: "{{ low_batteries }}"
- action: notify.mobile_app_iphone_14_pro
  data:
    title: "\U0001F50B Low Battery Alert"
    message: "{{ low_batteries }}"
mode: single
