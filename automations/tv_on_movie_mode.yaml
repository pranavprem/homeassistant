# TV on — movie mode (close curtains during day, dim lights)
alias: "TV On - Movie Mode"
description: "When the living room TV turns on, close curtains (daytime only) and dim lights"
mode: single
trigger:
  - platform: state
    entity_id: media_player.living_room
    from: "off"
    to: "on"
  - platform: state
    entity_id: media_player.living_room
    from: "off"
    to: "playing"
  - platform: state
    entity_id: media_player.living_room
    from: "off"
    to: "idle"
action:
  # Close curtains only during daytime (sun above horizon + at least 30 min before sunset)
  - if:
      - condition: state
        entity_id: sun.sun
        state: "above_horizon"
      - condition: template
        value_template: >
          {{ state_attr('sun.sun', 'elevation') | float > 3 }}
    then:
      - action: cover.close_cover
        target:
          entity_id:
            - cover.backyard_curtain
            - cover.backyard_curtain_2
            - cover.deck_curtain
            - cover.deck_curtain_2
  # Always dim lights regardless of time
  - action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      brightness_pct: 15
  - action: light.turn_on
    target:
      entity_id: light.couch_lamp
    data:
      brightness_pct: 10
  # Dim Govee light bar for ambient movie vibe
  - action: light.turn_on
    target:
      entity_id: light.living_room_light_bar
    data:
      brightness_pct: 5
