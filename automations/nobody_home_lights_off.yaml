# Nobody home — all lights off
alias: "Nobody Home - Lights Off"
description: "Turn off all lights when nobody is home"
mode: single
trigger:
  - platform: state
    entity_id: person.pranav
    from: "home"
    to: "not_home"
    for:
      minutes: 5
  - platform: state
    entity_id: person.abhinaya
    from: "home"
    to: "not_home"
    for:
      minutes: 5
condition:
  # Both must be away
  - condition: state
    entity_id: person.pranav
    state: "not_home"
  - condition: state
    entity_id: person.abhinaya
    state: "not_home"
action:
  # Turn off all lights
  - action: light.turn_off
    target:
      entity_id:
        - light.ambient_light
        - light.closet
        - light.closet_side
        - light.couch_lamp
        - light.guest_room
        - light.hue_color_lamp_1
        - light.living_room
        - light.master_bedroom
        - light.painting_light
        - light.reading_corner
        - light.reading_light
        - light.studio
        - light.window
        - light.window_side
  # Also turn off Dreo
  - action: climate.turn_off
    target:
      entity_id: climate.dreyo_air_conditioner
