id: neo_bedtime
alias: Bedtime Mode
description: When either Pranav or Abhinaya gets into bed, activate sleep mode
triggers:
- type: occupied
  device_id: f694659a26815997b804b098681229b3
  entity_id: 05e5c4da6b63c59af8b16c18afbd3055
  domain: binary_sensor
  trigger: device
- type: occupied
  device_id: 01b23888cff5aaaf007f3a7f20595f8a
  entity_id: bca3bc42dd8019d37d826da756b5d5de
  domain: binary_sensor
  trigger: device
# Biometric fallback — heart rate / breathing / HRV indicates someone in bed
- trigger: template
  value_template: >
    {% set hr = states('sensor.pranav_s_eight_sleep_side_heart_rate') %}
    {% set br = states('sensor.pranav_s_eight_sleep_side_breath_rate') %}
    {{ (hr not in ['unknown','unavailable','none','0'] and hr|float(0) > 30) or
       (br not in ['unknown','unavailable','none','0'] and br|float(0) > 5) }}
  for:
    seconds: 30
- trigger: template
  value_template: >
    {% set hr = states('sensor.abhinaya_s_eight_sleep_side_heart_rate') %}
    {% set br = states('sensor.abhinaya_s_eight_sleep_side_breath_rate') %}
    {{ (hr not in ['unknown','unavailable','none','0'] and hr|float(0) > 30) or
       (br not in ['unknown','unavailable','none','0'] and br|float(0) > 5) }}
  for:
    seconds: 30
conditions:
- condition: time
  after: '21:00:00'
  before: 03:00:00
# 12-hour cooldown — don't re-trigger if already ran recently
- condition: template
  value_template: >
    {{ (as_timestamp(now()) - as_timestamp(state_attr('automation.bedtime_mode', 'last_triggered') | default(0))) > 43200 }}
actions:
- action: light.turn_off
  target:
    entity_id: light.master_bedroom
- action: climate.turn_on
  target:
    entity_id:
    - climate.pranav_s_eight_sleep_side_climate
    - climate.abhinaya_s_eight_sleep_side_climate
- action: media_player.play_media
  target:
    entity_id: media_player.wigglytuff_base_speaker
  data:
    media:
      media_content_id: white_noise
      media_content_type: music
      metadata: {}
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: 🛏️ Bedtime Mode
    message: Lights off, Eight Sleep on, white noise on. Goodnight!
mode: single
