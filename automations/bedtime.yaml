# Bedtime automation — triggers when either person gets into bed
# Eight Sleep bed presence → lights off, Eight Sleep climate on, white noise, Dreo on
alias: "Bedtime Mode"
description: "When either Pranav or Abhinaya gets into bed, activate sleep mode"
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.pranav_s_eight_sleep_side_bed_presence
    to: "on"
    for:
      minutes: 2
  - platform: state
    entity_id: binary_sensor.abhinaya_s_eight_sleep_side_bed_presence
    to: "on"
    for:
      minutes: 2
condition:
  # Only trigger after 9 PM and before 3 AM
  - condition: time
    after: "21:00:00"
    before: "03:00:00"
action:
  # Turn off master bedroom lights
  - action: light.turn_off
    target:
      entity_id: light.master_bedroom
  # Turn on Eight Sleep climate for both sides
  - action: climate.turn_on
    target:
      entity_id:
        - climate.pranav_s_eight_sleep_side_climate
        - climate.abhinaya_s_eight_sleep_side_climate
  # Start white noise on Eight Sleep speaker
  - action: media_player.play_media
    target:
      entity_id: media_player.wigglytuff_base_speaker
    data:
      media_content_type: music
      media_content_id: white_noise
  # Turn on Dreo — mode depends on season
  # Winter (Nov-Mar): fan mode / Summer (Apr-Oct): AC mode
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().month in [11, 12, 1, 2, 3] }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.dreyo_air_conditioner
            data:
              hvac_mode: fan_only
      - conditions:
          - condition: template
            value_template: "{{ now().month in [4, 5, 6, 7, 8, 9, 10] }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.dreyo_air_conditioner
            data:
              hvac_mode: cool
  # Notify
  - action: notify.mobile_app_pranavs_pocket_tv
    data:
      title: "🛏️ Bedtime Mode"
      message: "Lights off, Eight Sleep on, Dreo on. Goodnight!"
