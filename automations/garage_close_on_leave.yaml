id: neo_garage_close_on_leave
alias: Garage Door - Close When Leaving
description: Close the garage door when Pranav or Abhinaya leaves home proximity
triggers:
- platform: zone
  entity_id:
  - person.pranav
  - person.abhinaya
  zone: zone.home
  event: leave
conditions:
- condition: state
  entity_id: cover.ratgdo_garage_door
  state: open
actions:
- action: cover.close_cover
  target:
    entity_id: cover.ratgdo_garage_door
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: 🚗 Garage Door Closed
    message: '{{ trigger.to_state.attributes.friendly_name }} left home — garage door
      closed automatically.'
- action: notify.mobile_app_iphone_14_pro
  data:
    title: 🚗 Garage Door Closed
    message: '{{ trigger.to_state.attributes.friendly_name }} left home — garage door
      closed automatically.'
mode: single
