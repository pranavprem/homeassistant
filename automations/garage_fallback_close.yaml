id: neo_garage_fallback_close
alias: Garage Door - Fallback Close After 10 Minutes
description: Close the garage door if it has been left open for 10 minutes, even if location-based automations fail
triggers:
- trigger: state
  entity_id: cover.ratgdo_garage_door
  to: open
  for:
    minutes: 10
conditions:
- condition: state
  entity_id: cover.ratgdo_garage_door
  state: open
actions:
- action: cover.close_cover
  target:
    entity_id: cover.ratgdo_garage_door
- action: notify.mobile_app_pranav_s_pocket_tv
  data:
    title: 🚗 Garage Door Closed
    message: Garage door was still open after 10 minutes, so the fallback auto-close ran.
- action: notify.mobile_app_iphone_14_pro
  data:
    title: 🚗 Garage Door Closed
    message: Garage door was still open after 10 minutes, so the fallback auto-close ran.
mode: single
