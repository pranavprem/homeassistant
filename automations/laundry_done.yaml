id: neo_laundry_done
alias: Laundry Done Notification
description: Notify when washer or dryer finishes a cycle
triggers:
- platform: state
  entity_id: sensor.blastoise_current_status
  to: end
  id: washer_done
- platform: state
  entity_id: sensor.dryer_current_status
  to: end
  id: dryer_done
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: washer_done
    sequence:
    - action: notify.mobile_app_pranav_s_pocket_tv
      data:
        title: 🧺 Washer Done!
        message: Blastoise finished the wash cycle — time to move clothes to the dryer
    - action: notify.mobile_app_iphone_14_pro
      data:
        title: 🧺 Washer Done!
        message: Blastoise finished the wash cycle — time to move clothes to the dryer
  - conditions:
    - condition: trigger
      id: dryer_done
    sequence:
    - action: notify.mobile_app_pranav_s_pocket_tv
      data:
        title: 🧺 Dryer Done!
        message: Dryer finished — clothes are ready to fold
    - action: notify.mobile_app_iphone_14_pro
      data:
        title: 🧺 Dryer Done!
        message: Dryer finished — clothes are ready to fold
mode: parallel
