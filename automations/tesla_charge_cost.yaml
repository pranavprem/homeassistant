id: neo_tesla_charge_cost
alias: Tesla Charge Session Cost
description: When Tesla finishes charging, notify with energy used and estimated cost
triggers:
- trigger: state
  entity_id: binary_sensor.tesla_wall_connector_vehicle_connected
  from: 'on'
  to: 'off'
- trigger: state
  entity_id: sensor.tesla_wall_connector_status
  to: not_connected
  from: charging
conditions: []
actions:
- variables:
    session_kwh: '{{ states(''sensor.tesla_wall_connector_session_energy'') | float(0) }}'
    total_kwh: '{{ states(''sensor.tesla_wall_connector_energy'') | float(0) }}'
    hour: '{{ now().hour }}'
    month: '{{ now().month }}'
    is_summer: '{{ month >= 6 and month <= 9 }}'
    rate: "{% if is_summer %}\n  {% if hour >= 16 and hour < 21 %}0.54\n  {% elif (hour >= 15 and hour < 16) or (hour >= 21 and hour < 24) %}0.43\n  {% else %}0.23{% endif %}\n{% else %}\n  {% if hour >= 16 and hour < 21 %}0.41\n  {% elif (hour >= 15 and hour < 16) or (hour >= 21 and hour < 24) %}0.39\n  {% else %}0.23{% endif %}\n{% endif %}\n"
    avg_offpeak_rate: 0.23
    session_cost: '{{ (session_kwh * avg_offpeak_rate) | round(2) }}'
    total_cost: '{{ (total_kwh * avg_offpeak_rate) | round(0) }}'
- action: notify.mobile_app_iphone_14_pro
  data:
    title: ⚡ Killua Charge Complete
    message: 'Session: {{ session_kwh | round(1) }} kWh (~${{ session_cost }} at off-peak) Current rate: ${{ rate }}/kWh (EV2-A {{ ''summer'' if is_summer else ''winter'' }}) Lifetime: {{ total_kwh | round(0) }} kWh (~${{ total_cost }})

      '
mode: single
