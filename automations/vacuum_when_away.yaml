id: neo_vacuum_when_away
alias: Vacuum When Everyone Leaves
description: Start Kanta Bai when everyone leaves home (once per day max)
triggers:
- platform: zone
  entity_id:
  - person.pranav
  - person.abhinaya
  zone: zone.home
  event: leave
conditions:
- condition: not
  conditions:
  - condition: zone
    entity_id: person.pranav
    zone: zone.home
  - condition: zone
    entity_id: person.abhinaya
    zone: zone.home
- condition: time
  after: 08:00:00
  before: '20:00:00'
- condition: template
  value_template: '{{ (as_timestamp(now()) - as_timestamp(state_attr(''automation.vacuum_when_everyone_leaves'',
    ''last_triggered'') | default(0))) > 43200 }}'
- condition: state
  entity_id: vacuum.kanta_bai
  state: docked
actions:
- delay:
    minutes: 5
- condition: not
  conditions:
  - condition: zone
    entity_id: person.pranav
    zone: zone.home
  - condition: zone
    entity_id: person.abhinaya
    zone: zone.home
- action: vacuum.start
  target:
    entity_id: vacuum.kanta_bai
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: "\U0001F916 Kanta Bai Deployed!"
    message: Everyone's away — Kanta Bai is cleaning upstairs
- action: notify.mobile_app_iphone_14_pro
  data:
    title: "\U0001F916 Kanta Bai Deployed!"
    message: Everyone's away — Kanta Bai is cleaning upstairs
mode: single
