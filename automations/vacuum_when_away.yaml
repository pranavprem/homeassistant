id: neo_vacuum_when_away
alias: Vacuum When Everyone Away
description: Check every 30 min if everyone is away — start Kanta Bai (once per day)
triggers:
- trigger: time_pattern
  minutes: "/30"
conditions:
- condition: state
  entity_id: person.pranav
  state: not_home
- condition: state
  entity_id: person.abhinaya
  state: not_home
- condition: time
  after: 08:00:00
  before: '20:00:00'
- condition: state
  entity_id: vacuum.kanta_bai
  state: docked
actions:
- action: vacuum.start
  target:
    entity_id: vacuum.kanta_bai
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: "\U0001F916 Kanta Bai Deployed!"
    message: Everyone's away — Kanta Bai is cleaning upstairs
- action: notify.mobile_app_iphone_14_pro
  data:
    title: "\U0001F916 Kanta Bai Deployed!"
    message: Everyone's away — Kanta Bai is cleaning upstairs
mode: single
