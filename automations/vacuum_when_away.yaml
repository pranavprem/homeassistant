id: neo_vacuum_when_away
alias: Vacuum When Everyone Leaves
description: Start Kanta Bai when everyone leaves home (once per day max)
triggers:
- trigger: state
  entity_id:
  - person.pranav
  - person.abhinaya
  to: not_home
conditions:
- condition: state
  entity_id: person.pranav
  state: not_home
- condition: state
  entity_id: person.abhinaya
  state: not_home
- condition: time
  after: 08:00:00
  before: '20:00:00'
- condition: state
  entity_id: vacuum.kanta_bai
  state: docked
actions:
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: "\U0001F916 Kanta Bai Deploying..."
    message: Both away — starting vacuum in 2 minutes (cancel by coming home)
- delay:
    minutes: 2
- condition: state
  entity_id: person.pranav
  state: not_home
- condition: state
  entity_id: person.abhinaya
  state: not_home
- action: vacuum.start
  target:
    entity_id: vacuum.kanta_bai
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: "\U0001F916 Kanta Bai Deployed!"
    message: Everyone's away — Kanta Bai is cleaning upstairs
- action: notify.mobile_app_iphone_14_pro
  data:
    title: "\U0001F916 Kanta Bai Deployed!"
    message: Everyone's away — Kanta Bai is cleaning upstairs
mode: restart
