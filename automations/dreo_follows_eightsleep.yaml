id: neo_dreo_follows_eightsleep
alias: Dreo Follows Eight Sleep
description: Dreo turns on when either Eight Sleep side turns on, off when both are
  off. Mode based on room temperature.
triggers:
- entity_id:
  - climate.pranav_s_eight_sleep_side_climate
  - climate.abhinaya_s_eight_sleep_side_climate
  trigger: state
  to: heat_cool
- entity_id:
  - climate.pranav_s_eight_sleep_side_climate
  - climate.abhinaya_s_eight_sleep_side_climate
  trigger: state
  to: 'off'
conditions: []
actions:
- choose:
  - conditions:
    - condition: or
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.pranav_s_eight_sleep_side_climate
          state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.abhinaya_s_eight_sleep_side_climate
          state: 'off'
    sequence:
    - choose:
      - conditions:
        - condition: numeric_state
          entity_id: sensor.wigglytuff_eight_sleep_hub_room_temperature
          above: 74
        sequence:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.dreyo_air_conditioner
          data:
            hvac_mode: cool
      default:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.dreyo_air_conditioner
        data:
          hvac_mode: fan_only
    - action: notify.mobile_app_pranavs_pocket_tv
      data:
        title: 🌀 Dreo On
        message: Eight Sleep is active — Dreo set to {{ 'cool' if states('sensor.wigglytuff_eight_sleep_hub_room_temperature')
          | float(0) > 74 else 'fan' }} mode (room {{ states('sensor.wigglytuff_eight_sleep_hub_room_temperature')
          | round(1) }}°F)
    - action: notify.mobile_app_iphone_14_pro
      data:
        title: 🌀 Dreo On
        message: Eight Sleep is active — Dreo set to {{ 'cool' if states('sensor.wigglytuff_eight_sleep_hub_room_temperature')
          | float(0) > 74 else 'fan' }} mode (room {{ states('sensor.wigglytuff_eight_sleep_hub_room_temperature')
          | round(1) }}°F)
  default:
  - action: climate.turn_off
    target:
      entity_id: climate.dreyo_air_conditioner
  - action: notify.mobile_app_pranavs_pocket_tv
    data:
      title: 🌀 Dreo Off
      message: Both Eight Sleep sides off — Dreo turned off
  - action: notify.mobile_app_iphone_14_pro
    data:
      title: 🌀 Dreo Off
      message: Both Eight Sleep sides off — Dreo turned off
mode: single
