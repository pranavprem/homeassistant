id: neo_air_purifier_mode
alias: Air Purifiers - Smart Mode
description: Quiet (sleep) when home, full speed when everyone away, re-enforced every 30 minutes
triggers:
- trigger: state
  entity_id:
  - person.pranav
  - person.abhinaya
  to: not_home
- trigger: state
  entity_id:
  - person.pranav
  - person.abhinaya
  to: home
- trigger: time_pattern
  minutes: "/30"
- trigger: homeassistant
  event: start
actions:
- choose:
  - conditions:
    - condition: state
      entity_id: person.pranav
      state: not_home
    - condition: state
      entity_id: person.abhinaya
      state: not_home
    sequence:
    - action: fan.turn_on
      continue_on_error: true
      target:
        entity_id:
        - fan.studio_filter
        - fan.master_bedroom_filter
        - fan.living_room_filter
    - action: fan.set_percentage
      continue_on_error: true
      target:
        entity_id:
        - fan.studio_filter
        - fan.master_bedroom_filter
        - fan.living_room_filter
      data:
        percentage: 100
  default:
  - action: fan.turn_on
    continue_on_error: true
    target:
      entity_id:
      - fan.studio_filter
      - fan.master_bedroom_filter
      - fan.living_room_filter
  - action: fan.set_preset_mode
    continue_on_error: true
    target:
      entity_id:
      - fan.studio_filter
      - fan.master_bedroom_filter
      - fan.living_room_filter
    data:
      preset_mode: sleep
mode: restart
