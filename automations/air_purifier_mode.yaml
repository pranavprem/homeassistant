id: neo_air_purifier_mode
alias: Air Purifiers - Smart Mode
description: Quiet (sleep) when home, full speed when everyone away
triggers:
- trigger: state
  entity_id:
  - person.pranav
  - person.abhinaya
  to: not_home
  id: someone_left
- trigger: state
  entity_id:
  - person.pranav
  - person.abhinaya
  to: home
  id: someone_home
actions:
- choose:
  - conditions:
    - condition: trigger
      id: someone_left
    - condition: state
      entity_id: person.pranav
      state: not_home
    - condition: state
      entity_id: person.abhinaya
      state: not_home
    sequence:
    - action: fan.turn_on
      target:
        entity_id:
        - fan.studio_filter
        - fan.master_bedroom_filter
        - fan.living_room_filter
    - action: fan.set_percentage
      target:
        entity_id:
        - fan.studio_filter
        - fan.master_bedroom_filter
        - fan.living_room_filter
      data:
        percentage: 100
  - conditions:
    - condition: trigger
      id: someone_home
    sequence:
    - action: fan.turn_on
      target:
        entity_id:
        - fan.studio_filter
        - fan.master_bedroom_filter
        - fan.living_room_filter
    - action: fan.set_preset_mode
      target:
        entity_id:
        - fan.studio_filter
        - fan.master_bedroom_filter
        - fan.living_room_filter
      data:
        preset_mode: sleep
mode: restart
