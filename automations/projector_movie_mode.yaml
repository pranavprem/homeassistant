id: neo_projector_movie_mode
alias: Projector On - Movie Mode
description: When guest bedroom projector starts sustained playback, dim lights
triggers:
- trigger: state
  entity_id: media_player.guest_bedroom_tv
  to: playing
  for:
    seconds: 20
conditions: []
actions:
- action: light.turn_on
  target:
    entity_id: light.guest_room
  data:
    brightness_pct: 5
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: "\U0001F3AC Projector Movie Mode"
    message: Projector on — guest room lights dimmed
mode: single
