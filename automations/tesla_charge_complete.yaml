id: neo_tesla_charge_complete
alias: Tesla Charge Complete
description: Notify when Killua finishes charging
triggers:
- platform: state
  entity_id: switch.killua_charge
  from: 'on'
  to: 'off'
conditions:
- condition: state
  entity_id: binary_sensor.killua_charge_cable
  state: 'on'
actions:
- action: notify.mobile_app_pranav_s_pocket_tv
  data:
    title: ⚡ Killua Fully Charged!
    message: Tesla is done charging — {{ states('sensor.killua_battery_level') }}% ({{ states('sensor.killua_battery_range') | round(0) }} mi), added {{ states('sensor.killua_charge_energy_added') }} kWh
- action: notify.mobile_app_iphone_14_pro
  data:
    title: ⚡ Killua Fully Charged!
    message: Tesla is done charging — {{ states('sensor.killua_battery_level') }}% ({{ states('sensor.killua_battery_range') | round(0) }} mi), added {{ states('sensor.killua_charge_energy_added') }} kWh
mode: single
