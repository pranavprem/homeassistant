id: neo_shanta_bai_maintenance
alias: Shanta Bai Maintenance Check
description: Daily 6pm check for water shortage, dirty water, maintenance needs
triggers:
- trigger: time
  at: '18:00:00'
conditions: []
actions:
- variables:
    issues: >
      {% set ns = namespace(problems=[]) %}
      {% if is_state('binary_sensor.shanta_bai_water_shortage', 'on') %}
        {% set ns.problems = ns.problems + ['💧 Clean water tank needs refilling'] %}
      {% endif %}
      {% if is_state('binary_sensor.shanta_bai_dock_dirty_water_box', 'on') %}
        {% set ns.problems = ns.problems + ['🚰 Dirty water box needs emptying'] %}
      {% endif %}
      {% if is_state('binary_sensor.shanta_bai_dock_clean_water_box', 'on') %}
        {% set ns.problems = ns.problems + ['📦 Clean water box issue'] %}
      {% endif %}
      {% if states('sensor.shanta_bai_filter_time_left') | float(999) < 10 %}
        {% set ns.problems = ns.problems + ['🔄 Filter needs replacement (' ~ states('sensor.shanta_bai_filter_time_left') | round(0) ~ 'h left)'] %}
      {% endif %}
      {% if states('sensor.shanta_bai_side_brush_time_left') | float(999) < 0 %}
        {% set ns.problems = ns.problems + ['🖌️ Side brush overdue for replacement (' ~ states('sensor.shanta_bai_side_brush_time_left') | round(0) ~ 'h)'] %}
      {% endif %}
      {% if states('sensor.shanta_bai_dock_strainer_time_left') | float(999) < 0 %}
        {% set ns.problems = ns.problems + ['🧹 Dock strainer overdue (' ~ states('sensor.shanta_bai_dock_strainer_time_left') | round(0) ~ 'h)'] %}
      {% endif %}
      {% if states('sensor.shanta_bai_sensor_time_left') | float(999) < 0 %}
        {% set ns.problems = ns.problems + ['👁️ Sensors overdue for cleaning (' ~ states('sensor.shanta_bai_sensor_time_left') | round(0) ~ 'h)'] %}
      {% endif %}
      {% if states('sensor.shanta_bai_dock_dock_error') != 'ok' %}
        {% set ns.problems = ns.problems + ['⚠️ Dock error: ' ~ states('sensor.shanta_bai_dock_dock_error')] %}
      {% endif %}
      {% if states('sensor.shanta_bai_vacuum_error') != 'none' %}
        {% set ns.problems = ns.problems + ['❌ Vacuum error: ' ~ states('sensor.shanta_bai_vacuum_error')] %}
      {% endif %}
      {{ ns.problems | join('\n') }}
- condition: template
  value_template: "{{ issues | length > 0 }}"
- action: notify.mobile_app_pranavs_pocket_tv
  data:
    title: "\U0001F9F9 Shanta Bai Needs Attention"
    message: "{{ issues }}"
- action: notify.mobile_app_iphone_14_pro
  data:
    title: "\U0001F9F9 Shanta Bai Needs Attention"
    message: "{{ issues }}"
mode: single
