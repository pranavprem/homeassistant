# Abhinaya morning Tesla climate — 30 min after she gets out of bed on weekdays
alias: "Abhinaya Morning - Tesla Climate"
description: "Turn on Tesla climate 30 min after Abhinaya wakes up on weekdays"
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.abhinaya_bed_occupied
    to: "off"
    for:
      minutes: 30
condition:
  # Weekdays only (Mon-Fri)
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
  # Morning hours only (5 AM - 10 AM)
  - condition: time
    after: "05:00:00"
    before: "10:00:00"
  # Make sure she hasn't gone back to bed
  - condition: state
    entity_id: binary_sensor.abhinaya_bed_occupied
    state: "off"
action:
  # Wake up Tesla first
  - action: button.press
    target:
      entity_id: button.killua_wake
  - delay:
      seconds: 30
  # Turn on Tesla climate
  - action: climate.turn_on
    target:
      entity_id: climate.killua_climate
  # Notify Pranav
  - action: notify.mobile_app_pranavs_pocket_tv
    data:
      title: "🚗 Tesla Climate On"
      message: "Killua is warming up for Abhinaya's commute"
