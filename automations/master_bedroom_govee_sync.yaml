id: neo_master_bedroom_govee_sync
alias: Master Bedroom Govee - Mirror Hue Lights
description: Keep the master bed Govee light bar in sync with closet, window, and reading corner
triggers:
- trigger: state
  entity_id:
    - light.closet
    - light.window
    - light.reading_corner
    - light.masted_bed_light_bar
- trigger: homeassistant
  event: start
conditions: []
actions:
- choose:
  - conditions:
    - condition: template
      value_template: >-
        {{
          is_state('light.closet', 'on')
          or is_state('light.window', 'on')
          or is_state('light.reading_corner', 'on')
        }}
    - condition: not
      conditions:
      - condition: state
        entity_id: light.masted_bed_light_bar
        state: 'on'
    sequence:
    - action: light.turn_on
      target:
        entity_id: light.masted_bed_light_bar
  - conditions:
    - condition: template
      value_template: >-
        {{
          is_state('light.closet', 'off')
          and is_state('light.window', 'off')
          and is_state('light.reading_corner', 'off')
        }}
    - condition: not
      conditions:
      - condition: state
        entity_id: light.masted_bed_light_bar
        state: 'off'
    sequence:
    - action: light.turn_off
      target:
        entity_id: light.masted_bed_light_bar
mode: restart
