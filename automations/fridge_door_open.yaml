id: neo_fridge_door_open
alias: Fridge Door Left Open
description: Notify if the fridge door is still open after 5 minutes, with a short grace re-check to avoid false alerts
triggers:
- trigger: state
  entity_id: binary_sensor.refrigerator_door
  to: 'on'
  for:
    minutes: 5
conditions: []
actions:
- delay:
    seconds: 15
- condition: state
  entity_id: binary_sensor.refrigerator_door
  state: 'on'
- action: notify.mobile_app_iphone_14_pro
  data:
    title: 🧊 Fridge Door Open!
    message: The fridge has been open for over 5 minutes
mode: restart
