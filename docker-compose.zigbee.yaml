name: homeassistant-zigbee

services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED=true
      - ZIGBEE2MQTT_CONFIG_PERMIT_JOIN=false
      - ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC=zigbee2mqtt
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=mqtt://mosquitto:1883
      - ZIGBEE2MQTT_CONFIG_MQTT_USER=${MQTT_USER:-mqtt}
      - ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD=${MQTT_PASSWORD}
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT=${ZIGBEE_ADAPTER_DEVICE:?ZIGBEE_ADAPTER_DEVICE is required}
      - ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER=${ZIGBEE_ADAPTER_TYPE:-zstack}
      - ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED=true
      - ZIGBEE2MQTT_CONFIG_FRONTEND_PORT=8080
      - ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL=${ZIGBEE2MQTT_LOG_LEVEL:-info}
    volumes:
      - ${HA_CONFIG_PATH:?HA_CONFIG_PATH is required}/../zigbee2mqtt/data:/app/data
    devices:
      - ${ZIGBEE_ADAPTER_DEVICE:?ZIGBEE_ADAPTER_DEVICE is required}:${ZIGBEE_ADAPTER_DEVICE:?ZIGBEE_ADAPTER_DEVICE is required}
    ports:
      - ${ZIGBEE2MQTT_BIND_IP:-127.0.0.1}:${ZIGBEE2MQTT_PORT:-43117}:8080
    networks:
      - automation
    security_opt:
      - no-new-privileges:true

networks:
  automation:
    external: true
    name: homeassistant_automation
